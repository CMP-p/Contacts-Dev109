    <!-- Internal CSS -->
     <style>        
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
        }

        div.contacts-box {
            border: 1px solid #fff;
            background-color: rgb(110, 90, 120);
            padding: 15px;
            margin: 10px;

            /* display: flex;
            justify-content: center; */
        }

        table {
            border: 1px solid skyblue;
            background-color: rgb(90, 90, 90);
            border-collapse: collapse;
            text-align: center;
            padding: 20px;
        }
        th {
            font-size: 20px;
            font-family: cursive;
            background-color: rgb(240, 165, 52);
            border: 2px solid black;
            padding: 10px;
            width: 75px;
        }
        td {
            background-color: #eeb526;
            border: 1px solid black;
            padding: 5px;
        }

    </style>
</head>

<body>
    <!-- 
    a 2 column list of contacts.
            2 | Name2 -->
    <!-- Html - a div with a 2x7 grid -->
    <div class="contacts-box">
        <table>
            <tr>
                <th>Slot #</th>
                <th>Name</th>
            </tr>
            <tr>
                <td>0</td>
                <td>Arnold</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Sly</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Dwayne</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Vin</td>
            </tr>
            <tr>
                <td>4</td>
                <td>JCVD</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Steven</td>
            </tr>
        </table>
        <button onclick="        
            const contacts = [
            'Arnold',
            'Sly',
            'Dwayne',
            'Vin',
            'JCVD',
            'Steven'
        ];    
        let userInput;
        let searching = true;
        let continueSearching;
        while (searching) {
            continueSearching = true;
            userInput = prompt('Enter the slot number you want displayed');
            switch (userInput) {
                case '0':
                    alert(`You selected ${contacts[0]}`)
                    break
                case '1':
                    alert(`You selected ${contacts[1]}`)
                    break
                case '2':
                    alert(`You selected ${contacts[2]}`)
                    break
                case '3':
                    alert(`You selected ${contacts[3]}`)
                    break
                case '4':
                    alert(`You selected ${contacts[4]}`)
                    break
                case '5':
                    alert(`You selected ${contacts[5]}`)
                    break

                default: 
                    alert('Name not found, please try again.')
                    break
            }

            while (continueSearching) {
                userInput = prompt('search for another name? (y/n)').toLowerCase()
                switch (userInput) {
                    case 'y':
                    case 'yes':
                        console.log('continuing action')
                        continueSearching = false
                        break
                    case 'n':
                    case 'no':
                        continueSearching = false
                        searching = false;
                        console.log('end action')
                        break
                    default:
                        alert('Please type y or n.')
                        break
                }
            }
        }
        console.log('Action finished')">
            Press Me!
        </button>
    </div>
