<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Emmanuelle">
    
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- Internal CSS -->
</head>

<body>
    <!-- 
    a 2 column list of contacts.
    a button that opens a prompt
        'Enter the slot number you want displayed'
           if number in array, display name (log & alert).
           else if number not in array, "not found try again"
        'Search for another name?' -->
    <!-- column 1: slot number | Column 2: Name -->
     <!--   0 | Name0
            1 | Name1
            2 | Name2 -->
    Html - a div with a 2x7 grid
    <div class="contacts-box">
        <section class="col1">
            <h2>Slot #</h2>
            <p id="slot0">0</p>
            <p id="slot1">1</p>
            <p id="slot2">2</p>
            <p id="slot3">3</p>
            <p id="slot4">4</p>
            <p id="slot5">5</p>
        </section>
        <section class="col2">
            <h2>Name</h2>
            <p class="name0">Arnold</p>
            <p class="name1">Sly</p>
            <p class="name2">Dwayne</p>
            <p class="name3">Vin</p>
            <p class="name4">JCVD</p>
            <p class="name5">Steven</p>
        </section>
    </div>
</body>
</html>
